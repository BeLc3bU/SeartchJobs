name: Agente Diario de Empleo

on:
  schedule:
    # 06:00 UTC = 08:00 hora peninsular española (CEST/CET)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Permisos explícitos para permitir que el workflow haga git commit y git push de la BD SQLite
permissions:
  contents: write

jobs:
  buscar-y-notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Agente de Empleo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/job_agent.py

      - name: Persistir Base de Datos SQLite en el Repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Asegurar que la base de datos y el JSON para Cloudflare están incluidos
          git add data/empleo.db data/ofertas.json
          
          # Comprobar si hay cambios staged antes de hacer commit
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en data/. No se requiere commit."
          else
            git commit -m "chore: actualización automática bd empleo y ofertas json [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "Cambios en data/empleo.db y data/ofertas.json guardados y subidos al repositorio."
          fi

