name: Agente Diario de Empleo

on:
  schedule:
    # 06:15 UTC = 08:15 hora peninsular (CEST verano) / 07:15 (CET invierno)
    # Se programa en minuto :15 para evitar saturación y colas en los servidores de GitHub Actions
    - cron: '15 6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/empleo.yml'
  workflow_dispatch:

# Permisos explícitos para permitir que el workflow haga git commit y git push de la BD SQLite
permissions:
  contents: write

jobs:
  buscar-y-notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Agente de Empleo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/job_agent.py

      - name: Persistir Base de Datos SQLite en el Repositorio
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Asegurar que la base de datos y el JSON para Cloudflare están incluidos
          git add data/empleo.db data/ofertas.json
          
          # Comprobar si hay cambios staged antes de hacer commit
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en data/. No se requiere commit."
          else
            git commit -m "chore: actualización automática bd empleo y ofertas json [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || echo "Aviso: no se pudo sincronizar git push, pero la búsqueda y notificación se completaron con éxito."
            echo "Base de datos y ofertas.json actualizados."
          fi

